name: build-ipa
# Builds an nxnative IPA on a GitHub Apple silicon runner. The game and prod.keys are never in this repo:
# they come from private, expiring S3 links in secrets (GAME_URL_<game>, KEYS_URL), and the IPA goes back the same way (IPA_PUT_URLS_<game>).
on:
  workflow_dispatch:
    inputs:
      mode:
        description: probe (machine info only) or build
        type: choice
        options: [probe, build]
        default: probe
      game:
        description: which game
        type: choice
        options: [WONDER, MK8D, ODYSSEY, NSMBUD]
        default: WONDER
      runner:
        description: runner image
        type: string
        default: xcode-27
      allow_other_metal:
        description: build with this image's Metal compiler if it is not Xcode 27.1's (pictures may render wrong)
        type: boolean
        default: false
permissions:
  contents: read
run-name: ${{ inputs.mode }} ${{ inputs.game }} on ${{ inputs.runner }}
jobs:
  run:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 355
    steps:
      - name: Machine
        run: |
          sw_vers; uname -m; sysctl -n machdep.cpu.brand_string; echo "cores $(sysctl -n hw.ncpu), RAM $(( $(sysctl -n hw.memsize) / 1073741824 )) GB"
          df -h / "$RUNNER_TEMP" || true
          ls -d /Applications/Xcode*.app || true
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version || echo "no iOS SDK"
          xcrun -sdk iphoneos metal --version || echo "no Metal toolchain"
          dotnet --list-sdks || echo "no dotnet"

      - name: Get nxnative
        if: inputs.mode == 'build'
        run: |
          git clone --depth 1 https://github.com/seedds/nxnative.git "$RUNNER_TEMP/nxnative"
          git -C "$RUNNER_TEMP/nxnative" log -1 --format='nxnative %h %cs %s'

      - name: Select Xcode
        if: inputs.mode == 'build'
        run: |
          # the Xcode whose Metal compiler is the one nxnative's shader chain is locked to (dm/gfx/tools/dmsh_chain.lock)
          WANT=$(awk -F'\t' '$1=="metal_iphoneos"{print $2}' "$RUNNER_TEMP/nxnative/dm/gfx/tools/dmsh_chain.lock"); echo "wanted: $WANT"
          PICK=""
          for X in $(ls -d /Applications/Xcode_27*.app | sort -rV); do
            [ -L "$X" ] && continue
            sudo xcode-select -s "$X"
            HAVE=$(xcrun -sdk iphoneos metal --version 2>/dev/null | head -1)
            if [ -z "$HAVE" ]; then xcodebuild -downloadComponent MetalToolchain >/dev/null 2>&1 || true; HAVE=$(xcrun -sdk iphoneos metal --version 2>/dev/null | head -1); fi
            echo "$X: $HAVE"
            if [ "$HAVE" = "$WANT" ]; then PICK=$X; break; fi
          done
          if [ -z "$PICK" ]; then echo "::warning::no Xcode here has $WANT"; PICK=$(ls -d /Applications/Xcode_27*.app | sort -V | tail -1); fi
          sudo xcode-select -s "$PICK"; xcodebuild -version; xcrun -sdk iphoneos metal --version | head -1
          xcrun --sdk iphoneos --show-sdk-version || sudo xcodebuild -downloadPlatform iOS

      - uses: actions/setup-python@v5
        if: inputs.mode == 'build'
        with:
          python-version: '3.13'

      - name: Tools
        if: inputs.mode == 'build'
        run: |
          brew install xcodegen zstd glslang
          python3 -c "import platform, sys; print(sys.version, platform.machine())"
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q lz4 capstone fonttools nsz zbic "backports.zstd; python_version < '3.14'"

      - name: Get game
        if: inputs.mode == 'build'
        env:
          GAME_URL: ${{ secrets[format('GAME_URL_{0}', inputs.game)] }}
          KEYS_URL: ${{ secrets.KEYS_URL }}
        run: |
          mkdir -p "$RUNNER_TEMP/Games/game" "$RUNNER_TEMP/keys"
          curl -fsS --retry 3 -o "$RUNNER_TEMP/keys/prod.keys" "$KEYS_URL"
          curl -fsS --retry 3 -o "$RUNNER_TEMP/Games/game/${{ inputs.game }}.nsp" "$GAME_URL"
          ls -la "$RUNNER_TEMP/Games/game"; df -h "$RUNNER_TEMP"

      - name: Check upload links
        if: inputs.mode == 'build'
        env:
          PUT_URLS: ${{ secrets[format('IPA_PUT_URLS_{0}', inputs.game)] }}
        run: |
          # before the long build: every link one line, https, no stray carriage return
          n=$(printf '%s\n' "$PUT_URLS" | tr -d '\r' | grep -c '^https://' || true)
          echo "$n upload links"; [ "$n" -ge 8 ] || { echo "::error::IPA_PUT_URLS_${{ inputs.game }} has $n usable links"; exit 1; }

      - name: Build IPA
        if: inputs.mode == 'build'
        run: |
          cd "$RUNNER_TEMP/nxnative"
          EXTRA=""; if [ "${{ inputs.allow_other_metal }}" = "true" ]; then EXTRA="--allow-other-metal"; fi
          "$RUNNER_TEMP/venv/bin/python" scripts/build_ipa_from_nsp.py "$RUNNER_TEMP/Games/game" -k "$RUNNER_TEMP/keys/prod.keys" $EXTRA

      - name: Upload IPA
        if: inputs.mode == 'build'
        env:
          PUT_URLS: ${{ secrets[format('IPA_PUT_URLS_{0}', inputs.game)] }}
        run: |
          rm -f "$RUNNER_TEMP/keys/prod.keys"
          IPA=$(ls "$RUNNER_TEMP/Games/game"/*.ipa | head -1); ls -la "$IPA"
          cd "$RUNNER_TEMP"; split -b 1000m "$IPA" ipa_part_
          i=0; for p in ipa_part_*; do i=$((i+1)); curl -fsS --retry 5 -T "$p" "$(printf '%s\n' "$PUT_URLS" | tr -d '\r' | sed -n "${i}p")"; done
          echo "uploaded $(basename "$IPA") in $i parts"

      - name: Keep logs
        if: always() && inputs.mode == 'build'
        run: |
          rm -f "$RUNNER_TEMP/keys/prod.keys"
          cd "$RUNNER_TEMP/Games/game" 2>/dev/null && tar czf "$RUNNER_TEMP/logs.tgz" *_build/logs *_survey 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always() && inputs.mode == 'build'
        with:
          name: build-logs-${{ inputs.game }}
          path: ${{ runner.temp }}/logs.tgz
          retention-days: 3
          if-no-files-found: ignore
